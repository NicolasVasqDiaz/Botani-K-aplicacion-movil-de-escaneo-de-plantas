android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AGP 9 built-in Kotlin: KSP (Hilt/Room) aún usa kotlin.sourceSets; suprimir error hasta que KSP migre
android.disallowKotlinSourceSets=false

# ─────────────────────────────────────────────────────────────
# Configuración de Cloudinary (subida de fotos de plantas)
# ─────────────────────────────────────────────────────────────
# Estos valores NO son secretos: el preset "unsigned" está diseñado para
# usarse desde apps cliente y de hecho ya viaja dentro del APK (BuildConfig).
# Se versionan aquí para que un clon limpio del repositorio compile y
# funcione sin configuración manual.
#
# La credencial que SÍ es secreta (la Service Account key de los scripts de
# seed) NO está aquí: ver seed/README.md.
CLOUDINARY_CLOUD_NAME=kroz25nj
CLOUDINARY_UPLOAD_PRESET=botanik_unsigned
